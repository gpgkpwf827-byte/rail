name: Prepare Network Rail geometry
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Area to convert'
        required: true
        default: east
        type: choice
        options:
          - east
          - national
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter requirements
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1 pyproj==3.7.2
      - name: Download and convert source geography
        run: python tools/import_network_rail.py --scope "${{ inputs.scope }}"
      - name: Upload converted map data and provenance report
        uses: actions/upload-artifact@v4
        with:
          name: network-rail-${{ inputs.scope }}-candidate
          path: |
            data/derived/network-rail-${{ inputs.scope }}.geojson
            data/derived/network-rail-${{ inputs.scope }}-metadata.json
          retention-days: 14
